name : CI pipelines
on:
  push:
    branches: [ main ]

jobs :
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name:  checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup@nodev3
        with:
            node-version: 16

      - name: install dependencies
        run: npm install

      - name : Run tests
        run : npm test
